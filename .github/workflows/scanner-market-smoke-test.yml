name: Scanner Market Smoke Test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "app/data_sources/market_data.py"
      - "app/services/backtest.py"
      - "app/services/candidate_data_enrichment.py"
      - "app/services/market_ranker.py"
      - "app/services/opportunity_profile.py"
      - "app/services/sector_rotation.py"
      - "app/utils/yfinance_frames.py"
      - "tests/test_backtest_multiindex.py"
      - "tests/test_opportunity_profile.py"
      - "tests/test_opportunity_profile_history_fallback.py"
      - "tests/test_yfinance_frames.py"
      - ".github/workflows/scanner-market-smoke-test.yml"
  schedule:
    # 15:00 UTC is inside the US regular session in both EDT and EST.
    # This is 22:00 Thailand time.
    - cron: "0 15 * * 1-5"

jobs:
  scanner-market-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Prefer the same canonical secrets used by Manager_Agent. Keep the old
      # Scanner names only as a migration fallback so one stale secret cannot
      # silently remain the authoritative credential.
      APCA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID || secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY || secrets.APCA_API_SECRET_KEY }}

    steps:
      - name: Checkout Scanner_Agent
        uses: actions/checkout@v6

      - name: Verify Alpaca market-data secrets
        run: |
          set -euo pipefail
          if [ -z "$APCA_API_KEY_ID" ] || [ -z "$APCA_API_SECRET_KEY" ]; then
            echo "Alpaca market-data secrets are missing."
            exit 1
          fi
          echo "Alpaca market-data secrets are configured."

      - name: Build Scanner_Agent image
        run: docker build -t scanner-agent-smoke-test:latest .

      - name: Start Scanner_Agent
        run: |
          docker run -d \
            --name scanner-agent \
            -p 8003:8003 \
            -e SCANNER_DEV_MODE=false \
            -e TRADING_MODE=PAPER \
            -e APCA_API_KEY_ID \
            -e APCA_API_SECRET_KEY \
            scanner-agent-smoke-test:latest

      - name: Wait for Scanner_Agent health
        run: |
          for i in {1..40}; do
            if curl -fsS http://localhost:8003/health >/dev/null; then
              echo "Scanner_Agent is healthy."
              exit 0
            fi
            echo "Waiting for Scanner_Agent... attempt $i"
            docker logs --tail=80 scanner-agent || true
            sleep 5
          done
          echo "Scanner_Agent did not become healthy in time."
          docker logs scanner-agent || true
          exit 1

      - name: Test real-market scanning and opportunity evidence
        env:
          REQUIRE_REGULAR_SESSION: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
        run: |
          mkdir -p reports
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          BASE_URL = "http://localhost:8003"
          SYMBOLS = [
              "AAPL", "MSFT", "NVDA", "GOOGL", "AMZN",
              "META", "TSLA", "AMD", "AVGO", "NFLX"
          ]
          FALLBACK_SOURCES = {"dev_fallback", "yfinance_market_data"}
          REQUIRE_REGULAR_SESSION = os.getenv("REQUIRE_REGULAR_SESSION", "false").lower() == "true"

          def post_json(path, payload):
              req = urllib.request.Request(
                  f"{BASE_URL}{path}",
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Content-Type": "application/json",
                      "X-Correlation-ID": "scanner-market-smoke-test",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=180) as resp:
                      return json.loads(resp.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8")
                  raise RuntimeError(f"HTTP {exc.code}: {body}") from exc

          def candidates(response):
              data = response.get("data") or {}
              return data.get("candidates") or [] if isinstance(data, dict) else []

          def metadata(candidate):
              value = candidate.get("metadata") or {}
              return value if isinstance(value, dict) else {}

          def details(candidate):
              value = metadata(candidate).get("details") or {}
              return value if isinstance(value, dict) else {}

          def data_bundle(candidate):
              value = details(candidate).get("data_bundle") or metadata(candidate).get("data_bundle") or {}
              return value if isinstance(value, dict) else {}

          def profile(candidate):
              value = data_bundle(candidate).get("opportunity_profile") or {}
              return value if isinstance(value, dict) else {}

          def market_snapshot(candidate):
              value = data_bundle(candidate).get("market_snapshot") or {}
              return value if isinstance(value, dict) else {}

          def candidate_source(candidate):
              return metadata(candidate).get("source")

          def is_ranked_technical_candidate(candidate):
              row_details = details(candidate)
              return (
                  candidate.get("recommendation") in {"BUY", "STRONG_BUY"}
                  and isinstance(row_details.get("scanner_v50"), dict)
                  and isinstance(row_details.get("final_score"), (int, float))
              )

          def is_fundamental_candidate(candidate):
              row_metadata = metadata(candidate)
              return all(
                  key in row_metadata
                  for key in ("quality", "growth", "valuation", "grade", "thesis")
              )

          def opportunity_check(candidate):
              row_profile = profile(candidate)
              evidence = row_profile.get("evidence_quality") or {}
              context = row_profile.get("execution_context") or {}
              snapshot = market_snapshot(candidate)
              provider_status = snapshot.get("provider_status") or {}
              provider_errors = snapshot.get("provider_errors") or []
              alpaca_errors = [
                  item for item in provider_errors
                  if isinstance(item, dict) and item.get("provider") == "alpaca"
              ]
              return {
                  "symbol": candidate.get("symbol"),
                  "status": row_profile.get("status"),
                  "workflow_status": row_profile.get("workflow_status"),
                  "coverage_ratio": evidence.get("coverage_ratio"),
                  "atr_available": evidence.get("atr_available"),
                  "relative_volume_available": evidence.get("relative_volume_available"),
                  "spread_available": evidence.get("spread_available"),
                  "quote_timestamp_available": evidence.get("quote_timestamp_available"),
                  "liquid_spread_sane": evidence.get("liquid_spread_sane"),
                  "spread_structurally_valid": evidence.get("spread_structurally_valid"),
                  "quote_status": context.get("quote_status"),
                  "market_session": context.get("market_session"),
                  "atr_pct": context.get("atr_pct"),
                  "relative_volume": context.get("relative_volume"),
                  "spread_bps": context.get("spread_bps"),
                  "alpaca_status": provider_status.get("alpaca"),
                  "alpaca_error_count": len(alpaca_errors),
              }

          payload = {"symbols": SYMBOLS, "screener": "default", "exchange": "US"}
          report = {
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "symbols_tested": SYMBOLS,
              "require_regular_session": REQUIRE_REGULAR_SESSION,
              "technical_scan": None,
              "fundamental_scan": None,
              "checks": [],
              "opportunity_evidence": [],
          }
          failures = []

          for name, path in [("technical_scan", "/scan"), ("fundamental_scan", "/scan/fundamental")]:
              response = post_json(path, payload)
              report[name] = response
              rows = candidates(response)
              fallback_symbols = [
                  row.get("symbol") for row in rows
                  if isinstance(row, dict) and candidate_source(row) in FALLBACK_SOURCES
              ]
              check = {
                  "section": name,
                  "status": response.get("status"),
                  "candidate_count": len(rows),
                  "symbols_found": [row.get("symbol") for row in rows if isinstance(row, dict)],
                  "fallback_symbols": fallback_symbols,
                  "response_error": response.get("error"),
                  "correlation_id": response.get("correlation_id"),
              }
              report["checks"].append(check)

              if response.get("status") != "success":
                  failures.append(f"{name}: response status is not success")
              if response.get("correlation_id") != "scanner-market-smoke-test":
                  failures.append(f"{name}: correlation ID was not propagated")
              if response.get("error"):
                  failures.append(f"{name}: response contains hidden scanner errors")
              if not rows:
                  failures.append(f"{name}: scanner returned zero candidates")
              if fallback_symbols:
                  failures.append(f"{name}: fallback candidates were returned: {fallback_symbols}")

              if name == "technical_scan":
                  invalid = [
                      row.get("symbol") for row in rows
                      if isinstance(row, dict) and not is_ranked_technical_candidate(row)
                  ]
                  if invalid:
                      failures.append(
                          "technical_scan: candidates are missing Scanner V5 ranking "
                          f"evidence or BUY recommendation: {invalid}"
                      )

                  opportunity_rows = [opportunity_check(row) for row in rows if isinstance(row, dict)]
                  report["opportunity_evidence"] = opportunity_rows
                  if opportunity_rows:
                      atr_coverage = sum(item["atr_available"] is True for item in opportunity_rows) / len(opportunity_rows)
                      rvol_coverage = sum(item["relative_volume_available"] is True for item in opportunity_rows) / len(opportunity_rows)
                      alpaca_ok = sum(
                          item["alpaca_status"] == "success" and item["alpaca_error_count"] == 0
                          for item in opportunity_rows
                      ) / len(opportunity_rows)
                      regular_rows = [
                          item for item in opportunity_rows
                          if item["market_session"] == "regular"
                      ]
                      regular_spread_sane = (
                          all(
                              item["spread_structurally_valid"] is True
                              and item["liquid_spread_sane"] is True
                              for item in regular_rows
                          )
                          if regular_rows
                          else None
                      )
                      report["atr_coverage"] = round(atr_coverage, 4)
                      report["relative_volume_coverage"] = round(rvol_coverage, 4)
                      report["alpaca_success_coverage"] = round(alpaca_ok, 4)
                      report["regular_session_candidate_count"] = len(regular_rows)
                      report["liquid_spread_sanity_passed"] = regular_spread_sane

                      if atr_coverage < 0.95:
                          failures.append(f"technical_scan: ATR coverage {atr_coverage:.1%} < 95%")
                      if rvol_coverage < 0.95:
                          failures.append(f"technical_scan: relative-volume coverage {rvol_coverage:.1%} < 95%")
                      if alpaca_ok < 0.95:
                          failures.append(f"technical_scan: Alpaca provider success {alpaca_ok:.1%} < 95%")
                      if regular_rows and regular_spread_sane is not True:
                          failures.append("technical_scan: regular-session liquid spread sanity check failed")

                      if REQUIRE_REGULAR_SESSION and len(regular_rows) != len(opportunity_rows):
                          failures.append(
                              "scheduled smoke did not observe US regular session for all candidates"
                          )
                      if regular_rows:
                          stale = [
                              item["symbol"] for item in regular_rows
                              if item["quote_status"] != "fresh"
                              or item["spread_available"] is not True
                              or item["quote_timestamp_available"] is not True
                          ]
                          if stale:
                              failures.append(
                                  "regular-session candidates lack fresh executable quote evidence: "
                                  + ", ".join(str(symbol) for symbol in stale)
                              )
              else:
                  invalid = [
                      row.get("symbol") for row in rows
                      if isinstance(row, dict) and not is_fundamental_candidate(row)
                  ]
                  if invalid:
                      failures.append(
                          "fundamental_scan: candidates are missing quality/growth/"
                          f"valuation evidence: {invalid}"
                      )

          Path("reports/scanner-market-smoke-test.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8"
          )

          lines = [
              "# Scanner Market Smoke Test",
              "",
              f"Generated at UTC: `{report['generated_at']}`",
              f"Require regular session: `{REQUIRE_REGULAR_SESSION}`",
              "",
              "## Coverage",
              f"- ATR: `{report.get('atr_coverage')}`",
              f"- Relative volume: `{report.get('relative_volume_coverage')}`",
              f"- Alpaca provider: `{report.get('alpaca_success_coverage')}`",
              f"- Regular-session candidates: `{report.get('regular_session_candidate_count')}`",
              f"- Regular-session liquid spread sanity: `{report.get('liquid_spread_sanity_passed')}`",
              "",
          ]
          if failures:
              lines.append("## Failures")
              lines.extend(f"- {failure}" for failure in failures)
          else:
              lines.extend([
                  "## Verdict",
                  "Scanner_Agent returned real-market opportunity evidence without provider fallback or hidden errors.",
              ])
          Path("reports/scanner-market-smoke-test.md").write_text(
              "\n".join(lines), encoding="utf-8"
          )
          print("\n".join(lines))

          if failures:
              print("\nSmoke test failed:", file=sys.stderr)
              for failure in failures:
                  print(f"- {failure}", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Fail on hidden provider or dataframe errors
        run: |
          docker logs scanner-agent > reports/scanner-agent.log 2>&1
          if grep -Eiq \
            "401 Authorization Required|403 Forbidden|truth value of a Series is ambiguous|FutureWarning: Calling float on a single element Series" \
            reports/scanner-agent.log; then
            echo "Scanner logs contain a hidden provider or dataframe failure."
            grep -Ein \
              "401 Authorization Required|403 Forbidden|truth value of a Series is ambiguous|FutureWarning: Calling float on a single element Series" \
              reports/scanner-agent.log || true
            exit 1
          fi

      - name: Upload scanner smoke test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scanner-market-smoke-test-report
          path: reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Show Scanner_Agent logs
        if: always()
        run: docker logs scanner-agent || true

      - name: Stop Scanner_Agent
        if: always()
        run: docker rm -f scanner-agent || true
