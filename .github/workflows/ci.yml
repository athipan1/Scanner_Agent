name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11']
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Import FastAPI app
        run: python -c "from app.main import app; print(app.title)"

      - name: Run scanner tests
        id: pytest
        continue-on-error: true
        run: |
          python -m pytest -q --tb=short --disable-warnings \
            > pytest-results.txt 2>&1

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-pytest-results-${{ matrix.python-version }}
          path: pytest-results.txt
          if-no-files-found: error

      - name: Fail when pytest fails
        if: steps.pytest.outcome == 'failure'
        run: |
          cat pytest-results.txt
          exit 1
